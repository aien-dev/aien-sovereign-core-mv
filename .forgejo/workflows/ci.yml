name: Sovereign CI

# DRA-45: this job runs on the self-hosted `spark` runner (the DGX Spark host,
# no container). A self-hosted runner must never run code from a pull request:
# a PR head, including a fork's, would execute on the host with the runner's
# access. Triggers are limited to push to the protected main branch and manual
# dispatch. Every runner label on this Forgejo maps to the Spark host, so a
# hosted event-guard job is not possible here; pre-merge CI for PRs runs
# through aien-local-ci (tools/aien-local-ci), not this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Workspace Verification & Invariant Audit
    runs-on: spark
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # Full history so AIEN_COMMIT_LINT_BASE can be resolved. A base that
          # is set but missing fails the commit lint.
          fetch-depth: 0

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Cargo Workspace Check
        run: cargo check --workspace --all-targets

      - name: Run Workspace Unit and Integration Tests
        env:
          # Pushes lint commits since github.event.before, except the all-zero
          # SHA that marks a newly created ref (then the variable is empty and
          # the lint skips; workflow_dispatch also leaves it empty). A fetch
          # that fails is a step failure.
          AIEN_COMMIT_LINT_BASE: ${{ (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: |
          if [ -n "$AIEN_COMMIT_LINT_BASE" ]; then
            if ! git cat-file -e "$AIEN_COMMIT_LINT_BASE^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$AIEN_COMMIT_LINT_BASE"
            fi
          fi
          cargo test --workspace --verbose

      - name: Enforce Zero Disk Secrets Invariant
        run: |
          echo "Auditing repository for prohibited plaintext secret files..."
          if find . -maxdepth 4 -name ".env*" -not -path "*/.git/*" -not -path "*/target/*" | grep -q .; then
            echo "Prohibited plaintext .env file found. Use an approved AIEN SecretProvider."
            exit 1
          fi
          echo "Zero plaintext .env files verified."

      - name: Enforce Sovereign Voice and Anti-Slop Invariant
        run: |
          echo "Auditing repository for em dashes, en dashes, and formulaic tropes..."
          BAD_CHARS=$(grep -rnE --exclude-dir=target --exclude-dir=.git --exclude='*.rs' '—|–' crates/ docs/ README.md || true)
          if [ -n "$BAD_CHARS" ]; then
            echo "Em dashes or en dashes detected:"
            echo "$BAD_CHARS"
            exit 1
          fi
          echo "Sovereign voice compliance verified."

      - name: Enforce Architectural Terminology Invariants
        run: |
          echo "Auditing documentation for deprecated absolute claims..."
          BAD_TERMS=$(grep -rnE --exclude-dir=target --exclude-dir=.git --exclude='0001-trust-evidence-foundation.md' 'all secrets reside in TPM|zero external network calls|universal portability' README.md docs/ || true)
          if [ -n "$BAD_TERMS" ]; then
            echo "Deprecated non-normative claims detected:"
            echo "$BAD_TERMS"
            exit 1
          fi
          echo "Architectural terminology verified."
