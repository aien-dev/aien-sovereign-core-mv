[package]
name = "spark-inquisitor"
version = "0.2.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "Autonomous Sovereign Inquisitor & Pull Request Alignment Gatekeeper"
license.workspace = true

[[bin]]
name = "spark-inquisitor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spark-crumbs = { git = "https://github.com/aien-dev/spark-crumbs", rev = "9355a92bc9adfe95a6ec5f8ac926f38a0b6e7db2" }
chrono = { version = "0.4", features = ["serde"] }
crumb-spec = { git = "https://github.com/aien-dev/crumb-spec", rev = "24194d1b7917ef19244aae6bcaff510686b75fef" }
regex = "1.13"
colored = "2.2"
