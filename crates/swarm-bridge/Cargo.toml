[package]
name = "swarm-bridge"
description = "Thin live bridge: delivers subscribed swarm-board events into running Claude Code sessions at their next hook boundary"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Vendored at the rev in third_party/synapse-coord.pin (tools/swarm-bridge/vendor-synapse-coord.sh).
synapse-coord = { path = "../../third_party/synapse-coord" }

[[bin]]
name = "swarm-bridge"
path = "src/main.rs"

[lib]
name = "swarm_bridge"
path = "src/lib.rs"
