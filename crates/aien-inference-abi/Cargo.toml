[package]
name = "aien-inference-abi"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "Sovereign native ABI for LLM inference backends"
license.workspace = true

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["sync", "rt", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
libloading = "0.8"
rayon = "1.10"
aien-abi-core = { path = "../aien-abi-core" }
aien-kv-cache = { path = "../aien-kv-cache" }
aien-platform = { path = "../aien-platform" }
aien-omega-gpu = { path = "../aien-omega-gpu" }
aien-omega-moe = { path = "../aien-omega-moe" }
aien-omega-fp8 = { path = "../aien-omega-fp8" }
aien-omega-dattn = { path = "../aien-omega-dattn" }
aien-omega-router = { path = "../aien-omega-router" }
aien-omega-bf16 = { path = "../aien-omega-bf16" }
aien-omega-pf = { path = "../aien-omega-pf" }
aien-omega-dgraph = { path = "../aien-omega-dgraph" }
parking_lot = "0.12"
sha2 = "0.10"



[features]
# Off by default: a production build fails closed (no reference weights, no
# silent CPU fallback behind the GPU backend). Only dev/test builds turn it on.
dev-fallback = []
