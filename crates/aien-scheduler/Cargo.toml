[package]
name = "aien-scheduler"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "Native continuous batching LLM scheduler with chunked prefill"
license.workspace = true

[dependencies]
aien-platform = { path = "../aien-platform" }
aien-abi-core = { path = "../aien-abi-core" }
aien-inference-abi = { path = "../aien-inference-abi" }
aien-kv-cache = { path = "../aien-kv-cache" }
spark-max-rs = { path = "../spark-max-rs", optional = true }
tokio = { version = "1.37", features = ["full"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

[dev-dependencies]
async-trait = "0.1"
sha2 = "0.10"

[[bin]]
name = "bench_inference_stack"
path = "src/bin/bench_inference_stack.rs"
required-features = ["max-yardstick"]

[[bin]]
name = "stress_aien_live"
path = "src/bin/stress_aien_live.rs"

[features]
# MUTANT ONLY (PREFILL-GATE). Never enable in a real build. Removes the
# scheduler's prefill readiness check so allocated-but-uncomputed block tables
# are decoded. The prefill-gate tests must FAIL with this feature on; see
# scripts/prefill-gate/mutant.sh.
prefill_mutant_no_check = []
# MUTANT ONLY (DUAL serve.admit_preempt tap). Never enable in a real build.
# Makes an installed observer stop admission after one grant per step, so the
# decision differs with the tap on. tests/dual_observer_parity.rs must FAIL
# with this feature on (negative control for the read-only tap).
dual_observer_mutant_changes_decision = []
# OFF by default. Pulls in the Modular MAX comparison bridge (spark-max-rs, spark-max-cabi) and
# builds the `bench_inference_stack` yardstick binary. MAX is a comparison tool only
# (Drake 2026-10-02); no production or qualification build may enable this.
max-yardstick = ["dep:spark-max-rs", "spark-max-rs/mojo-bridge"]
