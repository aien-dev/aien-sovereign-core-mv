[package]
name = "rad-id-sync"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "Identity & Key Synchronizer extension for Radicle sovereign git collaboration"
license.workspace = true

[lib]
name = "rad_id_sync"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rad-id-sync"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spark-crumbs = { git = "https://github.com/aien-dev/spark-crumbs", rev = "9355a92bc9adfe95a6ec5f8ac926f38a0b6e7db2" }
chrono = { version = "0.4", features = ["serde"] }
crumb-spec = { git = "https://github.com/aien-dev/crumb-spec", rev = "24194d1b7917ef19244aae6bcaff510686b75fef" }
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "zeroize"] }
rand = "0.8"
