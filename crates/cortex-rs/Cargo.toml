[package]
name = "cortex-rs"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "Sovereign native memory and knowledge engine for Atlas and AIEN"
license.workspace = true

[lib]
name = "cortex_rs"
path = "src/lib.rs"

[[bin]]
name = "cortex-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "macros", "tokio"] }
tokio = { version = "1.37", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
rusqlite = { version = "0.31", features = ["bundled", "bundled-full", "functions", "vtab", "column_decltype"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spark-crumbs = { git = "https://github.com/aien-dev/spark-crumbs", rev = "9355a92bc9adfe95a6ec5f8ac926f38a0b6e7db2" }
aien-localhttp = { path = "../aien-localhttp" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
crumb-spec = { git = "https://github.com/aien-dev/crumb-spec", rev = "24194d1b7917ef19244aae6bcaff510686b75fef" }
uuid = { version = "1.8", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive"] }
byteorder = "1.5"
sha2 = "0.10"
regex = "1.10"

[dev-dependencies]
aien-localhttp = { path = "../aien-localhttp", features = ["test-server"] }
