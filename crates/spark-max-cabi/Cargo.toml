[package]
license.workspace = true
name = "spark-max-cabi"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "Native C-ABI FFI bindings to the Modular MAX dynamic bridge library"

[dependencies]
libloading = "0.8"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.17"

[features]
# OFF by default. Runs `mojo build` for libspark_max.so (the Modular MAX comparison bridge) and
# records its build path in the binary. Never enable in a production or qualification build.
mojo-bridge = []
