[package]
name = "spark-dream"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "Native Rust Dynamic Dream Cycle Engine for autonomous session memory consolidation on SparkOS"
license.workspace = true

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spark-crumbs = { path = "../spark-crumbs" }
chrono = { version = "0.4", features = ["serde"] }
crumb-spec = { git = "https://github.com/aien-dev/crumb-spec-mv", rev = "24194d1b7917ef19244aae6bcaff510686b75fef" }
clap = { version = "4.5", features = ["derive"] }
aien-localhttp = { path = "../aien-localhttp" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
uuid = { version = "1.8", features = ["v4"] }
axum = { version = "0.7", features = ["tokio"] }

[[bin]]
name = "spark-dream"
path = "src/main.rs"

[lib]
name = "spark_dream"
path = "src/lib.rs"

[dev-dependencies]
aien-localhttp = { path = "../aien-localhttp", features = ["test-server"] }
