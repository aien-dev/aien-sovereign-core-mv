[package]
name = "spark-harness"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "Native Rust 5-layer change-management harness and MCP server for autonomous agents"
license.workspace = true

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spark-crumbs = { git = "https://github.com/aien-dev/spark-crumbs", rev = "9355a92bc9adfe95a6ec5f8ac926f38a0b6e7db2" }
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
crumb-spec = { git = "https://github.com/aien-dev/crumb-spec", rev = "24194d1b7917ef19244aae6bcaff510686b75fef" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonschema = { version = "0.17", default-features = false }
aien-proof = { path = "../aien-proof" }
blake3 = "1.8"

[[bin]]
name = "spark-harness"
path = "src/main.rs"

[lib]
name = "spark_harness"
path = "src/lib.rs"
