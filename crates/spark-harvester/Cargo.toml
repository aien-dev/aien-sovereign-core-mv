[package]
name = "spark-harvester"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
license.workspace = true
description = "Native Rust rights-gated harvester and provenance engine for sovereign AI datasets"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
regex = "1.10"
sha2 = "0.10"
thiserror = "1.0"
bitflags = { version = "2.5", features = ["serde"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pem"] }
hex = "0.4"
# SourceGrant v2 framed digest (aien-protocols-mv#59). Grants signed over the
# retired v1 transcript are refused; see crates/spark-harvester/README.md.
aien-protocol-types = { git = "https://github.com/aien-dev/aien-protocols-mv", rev = "28bc49ec57a89398fcb463cf71c0add7fcd2ef6c" }
aien-provenance = { git = "https://github.com/aien-dev/aien-protocols-mv", rev = "28bc49ec57a89398fcb463cf71c0add7fcd2ef6c" }

[dev-dependencies]
tempfile = "3.17"
