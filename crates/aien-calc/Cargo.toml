[package]
name = "aien-calc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Exact-arithmetic calculator with receipts: the check AI sessions call instead of trusting mental math"

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"

[dev-dependencies]
serde_json = "1.0"

[lib]
name = "aien_calc"
path = "src/lib.rs"

[[bin]]
name = "aien-calc"
path = "src/main.rs"
