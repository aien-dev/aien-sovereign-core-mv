[package]
name = "aien-calc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Exact-arithmetic calculator with receipts: the check AI sessions call instead of trusting mental math"

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"

[features]
# `aien-calc --mcp`: stdio MCP server. Off by default so the library stays free of I/O and async.
mcp = ["dep:rmcp", "dep:tokio", "dep:serde_json"]

[dependencies.rmcp]
version = "3.4.0"
default-features = false
features = ["server", "transport-io"]
optional = true

[dependencies.tokio]
version = "1.37"
features = ["rt", "io-util", "io-std"]
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dev-dependencies]
serde_json = "1.0"
rmcp = { version = "3.4.0", default-features = false, features = ["server", "client", "transport-io"] }
tokio = { version = "1.37", features = ["rt", "macros", "io-util", "io-std"] }
aien-inference-abi = { path = "../aien-inference-abi" }

[lib]
name = "aien_calc"
path = "src/lib.rs"

[[bin]]
name = "aien-calc"
path = "src/main.rs"
