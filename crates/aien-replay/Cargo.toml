[package]
name = "aien-replay"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Drake Stapleton <aien@aienos.com>"]
repository = "https://github.com/aien-spark/aien-sovereign-core"
description = "TRN1 execution transcript reference reader/verifier (Rust scaffolding per ADR 0024) and KV ownership property tests"
publish = false

# Standalone for now: this crate is its own workspace root so it builds with
# `cargo test --manifest-path crates/aien-replay/Cargo.toml` without editing the
# shared workspace member list (reserved by PR #138). The follow-up member PR
# deletes this table and adds "crates/aien-replay" to the root members list.
[workspace]

[dependencies]
sha2 = "0.10"

[dev-dependencies]
aien-kv-cache = { path = "../aien-kv-cache" }
proptest = { version = "1", default-features = false, features = ["std"] }
