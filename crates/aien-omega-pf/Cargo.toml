[package]
name = "aien-omega-pf"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "FFI to omega's device-resident prefill API: FP8 activation quantiser, QMMA grouped GEMM and causal prefill attention (OWN-30B whole-prompt prefill)"
license.workspace = true
build = "build.rs"

[dependencies]
aien-omega-gpu = { path = "../aien-omega-gpu" }
aien-omega-dattn = { path = "../aien-omega-dattn" }

[build-dependencies]
aien-abi-conformance = { path = "../aien-abi-conformance" }
