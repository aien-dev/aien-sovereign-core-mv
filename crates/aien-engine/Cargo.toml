[package]
name = "aien-engine"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "The engine (L312): movement engine (heartbeat ring along a static schedule) + power engine (pistons firing on pre-loaded buffers), one prewired schedule, one heartbeat, ignition timing receipts."

[dependencies]
aien-heartbeat = { path = "../aien-heartbeat" }
aien-inference-abi = { path = "../aien-inference-abi" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aien-wormhole = { path = "../aien-wormhole" }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[[bin]]
name = "engine"
path = "src/bin/engine.rs"
