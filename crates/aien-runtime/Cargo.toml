[package]
name = "aien-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Canonical single-process runtime spine for AIEN persistent branching intelligence"

[dependencies]
aien-platform = { path = "../aien-platform" }
aien-kv-cache = { path = "../aien-kv-cache" }
aien-kv-store = { path = "../aien-kv-store" }
aien-scheduler = { path = "../aien-scheduler" }
aien-trace = { path = "../aien-trace" }
aien-abi-core = { path = "../aien-abi-core" }
aien-inference-abi = { path = "../aien-inference-abi" }
aien-security = { path = "../aien-security" }
cortex-rs = { path = "../cortex-rs" }
aien-omega-compose = { path = "../aien-omega-compose" }
aien-allen = { path = "../aien-allen" }
aien-allen-profile = { path = "../aien-allen-profile" }
aien-allen-memory = { path = "../aien-allen-memory" }
# Headstart M3 (#537): only with feature `provisional-prep`; absent from default builds.
spark-harness = { path = "../spark-harness", optional = true }
aien-proof = { path = "../aien-proof", optional = true }

tokio = { version = "1.37", features = ["full"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
libc = "0.2"
thiserror = "1.0"

[features]
# NEXT-PHASE-2 fault harness only (ACCEPTANCE-v3 2.6): forced start-up
# reconcile failure. Enabled through aien-cli's `fault-hold`.
fault-hold = []
# Test seams that bypass the reserved-record guard (`note_unchecked`,
# `with_compose_bridge`). Enabled only by dev-dependencies, never by the daemon.
test-support = []
# Headstart M3 (#537): the opt-in provisional preparation adapter and final
# commit fence (src/provisional.rs). Default off: the default build compiles
# none of it and links neither spark-harness nor aien-proof.
provisional-prep = ["dep:spark-harness", "dep:aien-proof"]

[dev-dependencies]
aien-omega-gpu = { path = "../aien-omega-gpu" }
tempfile = "3.10"
aien-runtime = { path = ".", features = ["test-support"] }

# The CPU reference driver's prompt tests (examples/np1_reference.rs) run with `cargo test`.
[[example]]
name = "np1_reference"
test = true
