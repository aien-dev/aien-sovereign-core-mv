[package]
name = "spark-aegis"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <drake.aien@proton.me>"]
license.workspace = true
description = "Sovereign defensive boundary and containment engine"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
blake3 = "1.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
anyhow = "1.0"
libloading = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"

[features]
# OFF by default. Builds the optional Mojo matcher library with `mojo build` and records its
# build path in the binary. The pure Rust engine is the default and the fallback.
mojo-bridge = []
