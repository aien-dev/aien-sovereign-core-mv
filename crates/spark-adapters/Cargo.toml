[package]
name = "spark-adapters"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "Universal third-party model provider adapters and knowledge distillation engine for Sovereign SparkOS"
license.workspace = true

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spark-crumbs = { path = "../spark-crumbs" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
tracing = "0.1"
url = "2.5"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
crumb-spec = { git = "https://github.com/aien-dev/crumb-spec-mv", rev = "24194d1b7917ef19244aae6bcaff510686b75fef" }
uuid = { version = "1.8", features = ["v4"] }
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "spark-distill"
path = "src/bin/spark_distill.rs"

[lib]
name = "spark_adapters"
path = "src/lib.rs"
