[package]
name = "spark-mail-rs"
version = "0.1.0"
edition = "2024"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "Native Rust Sovereign Mail Server & Atlas Cortex Memory Bridge"
license.workspace = true

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
aien-localhttp = { path = "../aien-localhttp" }
uuid = { version = "1.10", features = ["v4", "serde"] }
axum = { version = "0.8.9" }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls", "hostname", "pool"] }
mailparse = "0.15"
aien-probe = { git = "https://github.com/aien-dev/aien-protocols", rev = "7ac6facb630ca7e9a6ab4125b292203fe2bb6687" }
cortex-rs = { path = "../cortex-rs" }

[dev-dependencies]
aien-localhttp = { path = "../aien-localhttp", features = ["test-server"] }

[[bin]]
name = "spark-mail"
path = "src/main.rs"

[lib]
name = "spark_mail"
path = "src/lib.rs"
