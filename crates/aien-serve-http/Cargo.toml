[package]
name = "aien-serve-http"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "OpenAI-compatible HTTP door for AIEN's own-kernel model serving (OWN-30B cut 4)"
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aien-serve-http"
path = "src/main.rs"

[dependencies]
axum = "0.7"
# Already in the graph through axum 0.7; named here for the connection loop in `server.rs`, which
# arms hyper's header read timeout (axum::serve gives hyper no timer, so that timeout never ran).
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio = { version = "1.37", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aien-inference-abi = { path = "../aien-inference-abi" }
aien-omega-gpu = { path = "../aien-omega-gpu" }
aien-omega-q38 = { path = "../aien-omega-q38" }
libc = "0.2"
aien-kv-store = { path = "../aien-kv-store" }
aien-platform = { path = "../aien-platform" }
aien-runtime = { path = "../aien-runtime" }
sha2 = "0.10"

[features]
# The merge train's per-request test switches (L384): `aien_test` in a chat request picks this
# request's path (strokes on/off, exact head on/off, a graph mutant, a row swap). TEST BUILDS
# ONLY: the live server is built without it and refuses any request carrying `aien_test`.
aien-test-switches = []

[dev-dependencies]
aien-inference-abi = { path = "../aien-inference-abi", features = ["host-test-engine"] }
