[package]
name = "aien-serve-http"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "OpenAI-compatible HTTP door for AIEN's own-kernel model serving (OWN-30B cut 4)"
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aien-serve-http"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.37", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aien-inference-abi = { path = "../aien-inference-abi" }
aien-omega-gpu = { path = "../aien-omega-gpu" }
aien-omega-dgraph = { path = "../aien-omega-dgraph" }
libc = "0.2"
