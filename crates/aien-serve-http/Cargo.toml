[package]
name = "aien-serve-http"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "OpenAI-compatible HTTP door for AIEN's own-kernel model serving (OWN-30B cut 4)"
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aien-serve-http"
path = "src/main.rs"

[features]
# The Omegese decode mask (`"constraint": "omegese"`): links omega's Omegese reader (see
# aien-omegese-constraint's build.rs). Off: the request field is refused and nothing else changes.
omegese = ["dep:aien-omegese-constraint"]

[dependencies]
aien-omegese-constraint = { path = "../aien-omegese-constraint", optional = true }
axum = "0.7"
tokio = { version = "1.37", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aien-inference-abi = { path = "../aien-inference-abi" }
aien-omega-gpu = { path = "../aien-omega-gpu" }
aien-omega-q38 = { path = "../aien-omega-q38" }
libc = "0.2"
aien-kv-store = { path = "../aien-kv-store" }
aien-platform = { path = "../aien-platform" }
aien-runtime = { path = "../aien-runtime" }
sha2 = "0.10"

[dev-dependencies]
aien-inference-abi = { path = "../aien-inference-abi", features = ["host-test-engine"] }
