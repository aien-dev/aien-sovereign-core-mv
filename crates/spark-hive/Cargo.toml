[package]
license.workspace = true
name = "spark-hive"
version = "0.1.0"
edition = "2024"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "Native Sovereign Honeycomb Hive Engine with Hexagonal Axial Geometry"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
crumb-spec = { git = "https://github.com/aien-dev/crumb-spec", rev = "24194d1b7917ef19244aae6bcaff510686b75fef" }
rusqlite = { version = "0.31", features = ["bundled", "bundled-full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spark-crumbs = { git = "https://github.com/aien-dev/spark-crumbs", rev = "9355a92bc9adfe95a6ec5f8ac926f38a0b6e7db2" }
thiserror = "2.0"
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.17"
