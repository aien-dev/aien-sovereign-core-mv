[package]
license.workspace = true
name = "spark-max-rs"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "High-level safe Rust client for Modular MAX execution via native C-ABI"

[dependencies]
spark-max-cabi = { path = "../spark-max-cabi" }
aien-abi-core = { path = "../aien-abi-core" }
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.17"
tokio = { version = "1.37", features = ["full"] }

[features]
# OFF by default; see spark-max-cabi. Comparison runs only.
mojo-bridge = ["spark-max-cabi/mojo-bridge"]
