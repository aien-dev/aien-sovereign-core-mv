name: Sovereign CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Workspace Verification & Invariant Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4


      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Verify Signed Release Install
        run: bash scripts/test-install-release.sh

      - name: Verify Piped Installer Bootstrap
        run: bash scripts/test-install.sh

      - name: Cargo Workspace Check
        run: cargo check --workspace --all-targets

      - name: Cargo Clippy Invariant
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Unit and Integration Tests
        env:
          # CPU-only runner: let the GPU-backend tests take the software fallback.
          # Recorded in every receipt; the strict real-model gate rejects it.
          AIEN_DEV_FALLBACK: "1"
        run: cargo test --workspace --verbose -- --test-threads=1

      - name: Strict-Mode Controls (no AIEN_DEV_FALLBACK)
        # The workspace test step above opts in to the dev fallback, which skips every
        # strict branch of the GPU-backend tests. These targets must also pass in a strict
        # process: a stub build must refuse the GPU backend instead of computing on the CPU.
        run: |
          cargo test -p aien-inference-abi --lib --test attention_wiring --test transformer_parity -- --test-threads=1
          cargo test -p aien-inference-runtime --test strict_real_model -- --test-threads=1

      - name: Zero-CUDA Gate (aien-cli links no NVIDIA CUDA library or symbol)
        run: |
          bash scripts/zero-cuda-gate.sh --self-test
          cargo build -p aien-cli
          bash scripts/zero-cuda-gate.sh target/debug/aien-cli

      - name: Verify Preflight Branch Guard (both contexts)
        run: bash scripts/test-preflight-branch-guard.sh

      - name: Run Required Agent Preflight
        env:
          AIEN_PROOF_OFF: '1'
          # CI runners have no GB10; the dev fallback is a recorded opt-in here only (see aien-inference-abi::strict)
          AIEN_DEV_FALLBACK: '1'
          # push to main validates an already-merged tree; PRs keep the developer branch policy
          AIEN_PREFLIGHT_CONTEXT: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && 'merged-tree' || 'developer' }}
        run: bash scripts/agent-preflight.sh

      - name: Enforce Zero Disk Secrets Invariant
        run: |
          echo "Auditing repository for prohibited plaintext secret files..."
          if find . -maxdepth 4 -name ".env*" -not -path "*/.git/*" -not -path "*/target/*" | grep -q .; then
            echo "::error::Prohibited plaintext .env file found. Use an approved AIEN SecretProvider."
            exit 1
          fi
          echo "Zero plaintext .env files verified."

      - name: Enforce Sovereign Voice and Anti-Slop Invariant
        run: |
          echo "Auditing repository for em dashes, en dashes, and formulaic tropes..."
          BAD_CHARS=$(grep -rnE --exclude-dir=target --exclude-dir=.git --exclude-dir=aien-protocols --exclude="*.rs" --exclude="*.json" --exclude="*.safetensors" --exclude="FORGEJO_CI.md" "—|–" crates/ docs/ README.md || true)
          if [ -n "$BAD_CHARS" ]; then
            echo "::error::Em dashes or en dashes detected:"
            echo "$BAD_CHARS"
            exit 1
          fi
          echo "Sovereign voice compliance verified."
