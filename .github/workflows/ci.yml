name: Sovereign CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Workspace Verification & Invariant Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: No Python guard (fails if any Python file is tracked)
        run: sh scripts/check-no-python.sh


      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Verify Signed Release Install
        run: bash scripts/test-install-release.sh

      - name: Offline-signing handoff (ceremony rehearsal, offline sign, publish gate; throwaway keys only)
        run: bash scripts/test-offline-signing.sh

      - name: Public-key integration (ceremony public record to trust config; throwaway keys only)
        run: bash scripts/test-public-key-integration.sh

      - name: Release trust config is consistent (placeholder or pinned with matching ceremony record)
        run: bash scripts/check-release-trust-config.sh

      - name: Release gate negative tests (pins, digests, model inputs, signatures)
        run: bash scripts/test-release-checks.sh

      - name: Whole-system verifier tests (tools/aien-verify/tests/run.sh)
        run: sh tools/aien-verify/tests/run.sh

      - name: Pin materializer self-test (scripts/pins.sh, offline)
        run: bash scripts/test-pins.sh

      - name: Native library identity refusals (scripts/test-native-identity.sh, no omega needed)
        run: bash scripts/test-native-identity.sh

      - name: Verify Piped Installer Bootstrap
        run: bash scripts/test-install.sh

      - name: Verify Scoring Contract v5 (negative tests)
        run: bash docs/campaigns/scoring/test-scoring-v5.sh

      - name: Cargo Workspace Check
        run: cargo check --workspace --all-targets

      - name: Cargo Clippy Invariant
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Unit and Integration Tests
        env:
          # CPU-only runner: let the GPU-backend tests take the software fallback.
          # Recorded in every receipt; the strict real-model gate rejects it.
          AIEN_DEV_FALLBACK: "1"
        run: cargo test --workspace --verbose -- --test-threads=1

      - name: Strict-Mode Controls (no AIEN_DEV_FALLBACK)
        # The workspace test step above opts in to the dev fallback, which skips every
        # strict branch of the GPU-backend tests. These targets must also pass in a strict
        # process: a stub build must refuse the GPU backend instead of computing on the CPU.
        run: |
          cargo test -p aien-inference-abi --lib --test attention_wiring --test transformer_parity -- --test-threads=1
          cargo test -p aien-inference-runtime --test strict_real_model -- --test-threads=1

      - name: Zero-CUDA Gate (aien-cli links no NVIDIA CUDA library or symbol)
        run: |
          bash scripts/zero-cuda-gate.sh --self-test
          cargo build -p aien-cli
          bash scripts/zero-cuda-gate.sh target/debug/aien-cli

      - name: Verify Preflight Branch Guard (both contexts)
        run: bash scripts/test-preflight-branch-guard.sh

      - name: Run Required Agent Preflight
        env:
          AIEN_PROOF_OFF: '1'
          # CI runners have no GB10; the dev fallback is a recorded opt-in here only (see aien-inference-abi::strict)
          AIEN_DEV_FALLBACK: '1'
          # push to main validates an already-merged tree; PRs keep the developer branch policy
          AIEN_PREFLIGHT_CONTEXT: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && 'merged-tree' || 'developer' }}
        run: bash scripts/agent-preflight.sh

      - name: Enforce Zero Disk Secrets Invariant
        run: |
          echo "Auditing repository for prohibited plaintext secret files..."
          if find . -maxdepth 4 -name ".env*" -not -path "*/.git/*" -not -path "*/target/*" | grep -q .; then
            echo "::error::Prohibited plaintext .env file found. Use an approved AIEN SecretProvider."
            exit 1
          fi
          echo "Zero plaintext .env files verified."

      - name: Enforce Sovereign Voice and Anti-Slop Invariant
        run: |
          echo "Auditing repository for em dashes, en dashes, and formulaic tropes..."
          BAD_CHARS=$(grep -rnE --exclude-dir=target --exclude-dir=.git --exclude-dir=aien-protocols --exclude="*.rs" --exclude="*.json" --exclude="*.safetensors" --exclude="FORGEJO_CI.md" "—|–" crates/ docs/ README.md || true)
          # Saved model replies under docs/campaigns/*/replies/ are evidence named by the
          # sha256 of their exact bytes, so they cannot be reworded. Everything else stays audited.
          BAD_CHARS=$(printf "%s\n" "$BAD_CHARS" | grep -vE "^docs/campaigns/[^:]*/replies/[0-9a-f]{64}\.txt:" || true)
          if [ -n "$BAD_CHARS" ]; then
            echo "::error::Em dashes or en dashes detected:"
            echo "$BAD_CHARS"
            exit 1
          fi
          echo "Sovereign voice compliance verified."

  linked-compose:
    # The verify job builds the stub, where the compose-linked tests are #[ignore] and never run
    # (sovereign-core #306). This job builds the real omega composition library (CPU only, no GPU
    # engine) at the omega.lock pin and runs those tests. Mandatory: a failure blocks.
    name: Linked composition tests (real librx_compose, CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          rustc --version

      - name: Read pin (omega.lock)
        id: pins
        run: echo "omega=$(tr -d '[:space:]' < omega.lock)" >> "$GITHUB_OUTPUT"

      - name: Checkout omega at omega.lock
        uses: actions/checkout@v4
        with:
          repository: aien-spark/omega
          ref: ${{ steps.pins.outputs.omega }}
          path: omega

      - name: Read omega's physics.lock and aienos.lock
        id: sub
        run: |
          echo "physics=$(tr -d '[:space:]' < omega/physics.lock)" >> "$GITHUB_OUTPUT"
          echo "aienos=$(tr -d '[:space:]' < omega/aienos.lock)" >> "$GITHUB_OUTPUT"

      - name: Checkout physics at omega's physics.lock
        uses: actions/checkout@v4
        with:
          repository: aien-spark/physics
          ref: ${{ steps.sub.outputs.physics }}
          path: physics

      - name: Checkout aienos at omega's aienos.lock
        uses: actions/checkout@v4
        with:
          repository: aien-spark/aienos
          ref: ${{ steps.sub.outputs.aienos }}
          path: aienos

      - name: Run the linked composition tests (scripts/test-linked-compose.sh)
        run: bash scripts/test-linked-compose.sh "$GITHUB_WORKSPACE/omega" "$GITHUB_WORKSPACE/physics" "$GITHUB_WORKSPACE/aienos"

  headstart-feature-on:
    # Headstart M6 (sovereign-core #538). The verify job builds aien-runtime with its default
    # features, so the provisional-prep tests (Headstart M3, #537) never compile there. This job
    # runs them with the feature on, runs the M1/M2 harness tests, and checks that the default
    # build pulls in neither spark-harness nor aien-proof. Not a required check: making it
    # required is a branch-protection decision for the repository owner.
    name: Headstart feature-on tests (provisional-prep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Feature-off invariant (default aien-runtime links no spark-harness or aien-proof)
        run: |
          tree="$(cargo tree -e normal -p aien-runtime --prefix none)"
          if printf '%s\n' "$tree" | grep -E '^(spark-harness|aien-proof) '; then
            echo "default aien-runtime build depends on the Headstart crates above"
            exit 1
          fi
          echo "default aien-runtime build: no spark-harness, no aien-proof"

      - name: Headstart M3 adapter tests (aien-runtime, provisional-prep on)
        run: cargo test -p aien-runtime --features provisional-prep --test provisional_prep_test -- --test-threads=1

      - name: Headstart M1/M2 harness and scheduler tests (spark-harness)
        run: cargo test -p spark-harness

      - name: Headstart M6 A/B driver self-check (STUB build, overhead and correctness only)
        run: cargo test -p aien-runtime --features provisional-prep --test headstart_ab -- --ignored headstart_ab_smoke --test-threads=1

  omegese-constraint:
    # The Omegese guardrail (crates/aien-omegese-constraint) against the real oracle. Its real-oracle
    # tests are #[ignore] in the verify job (no omegese binary there). This job builds `omegese`
    # (one C file, CPU only) from omega at crates/aien-omegese-constraint/omegese.lock and runs them.
    # A pin of its own, separate from the root omega.lock (the release candidate's omega commit,
    # checked by scripts/check-release-candidate.sh): this one follows the Omegese grammar only.
    name: Omegese guardrail against the real oracle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          rustc --version

      - name: Read pin (crates/aien-omegese-constraint/omegese.lock)
        id: pin
        run: echo "omega=$(tr -d '[:space:]' < crates/aien-omegese-constraint/omegese.lock)" >> "$GITHUB_OUTPUT"

      - name: Checkout omega at the pin
        uses: actions/checkout@v4
        with:
          repository: aien-spark/omega
          ref: ${{ steps.pin.outputs.omega }}
          path: omega

      - name: Build omegese (the flags of omega's mk/omegese.mk)
        run: cc -std=gnu11 -Wall -Wextra -Werror -D_GNU_SOURCE -O2 -o "$RUNNER_TEMP/omegese" omega/tools/omegese/omegese.c

      - name: Real-oracle walks on the host fake
        env:
          OMEGESE_BIN: ${{ runner.temp }}/omegese
        run: cargo test -p aien-omegese-constraint --test echo_walks -- --ignored --test-threads=1 --nocapture
