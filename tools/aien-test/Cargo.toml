[package]
name = "aien-test"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AIEN-TEST Slices A to C: gate manifests, verdict derivation, immutable evidence receipts, dependency graph, resource pools with GPU locks, parallel runner, why, and the digest cache (ADR 0028)"

[dependencies]
# ed25519 for VerificationBundleV1 (ADR 0033 Decision 6); same crate, version and
# features as crates/rad-id-sync, so nothing new enters the lockfile.
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "zeroize"] }
libc = "0.2"
serde_json = "1.0"
sha2 = "0.10"

[[bin]]
name = "aien-test"
path = "src/main.rs"

[[bin]]
name = "aien-audit-inputs"
path = "src/bin/aien-audit-inputs.rs"

[lib]
name = "aien_test"
path = "src/lib.rs"
