[workspace]
resolver = "2"
members = [
    "crates/aien-abi-core",
    "crates/aien-capability",
    "crates/aien-cli",
    "crates/aien-mcp",
    "crates/spark-cockpit-rs",
    "crates/cortex-rs",
    "crates/spark-hive",
    "crates/spark-supervisor",
    "crates/spark-discord-hub",
    "crates/spark-debugger",
    "crates/spark-harness",
    "crates/spark-dream",
    "crates/spark-adapters",
    "crates/spark-crumbs",
    "crates/spark-inquisitor",
    "crates/cortex-encoder-rs",
    "crates/spark-mail-rs",
    "crates/spark-harvester",
    "crates/spark-aegis",
    "crates/aien-inference-abi",
    "crates/aien-kv-cache",
    "crates/aien-kv-store",
    "crates/aien-scheduler",
    "crates/aien-security",
    "crates/aien-platform",
    "crates/aien-platform-linux",
    "crates/aien-runtime",
    "crates/rad-id-sync",
    "crates/aien-inference-service",
    "crates/aien-inference-runtime",
    "crates/cortex-path-m1",
    "crates/aien-abi-conformance",
    "crates/aien-omega-gpu",
    "crates/aien-omega-moe",
    "crates/aien-omega-fp8",
    "crates/aien-omega-dattn",
    "crates/aien-omega-router",
    "crates/aien-omega-bf16",
    "crates/aien-omega-dgraph",
    "crates/aien-omega-compose",
    "crates/aien-omega-pf",
    "crates/aien-campaign-verifier",
    "crates/aien-proof",
    "crates/crumbs",
    "crates/aien-closure",
    "crates/aien-switchboard",
    "crates/aien-trace",
    "crates/aien-dual-observation",
    "crates/aien-allen",
    "crates/aien-allen-profile",
    "crates/aien-allen-memory",
    "tools/aien-test",
    "crates/aien-drive",
    "crates/aien-serve-http",
    "crates/aien-kv-bench",
    "crates/aien-omegese-constraint",
    "crates/aien-localhttp",
    "crates/swarm-bridge",
]
# Vendored dependency of swarm-bridge, not a workspace member (see third_party/synapse-coord.pin).
exclude = ["third_party/synapse-coord"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Drake Stapleton <aien@aienos.com>"]
repository = "https://github.com/aien-spark/aien-sovereign-core"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
