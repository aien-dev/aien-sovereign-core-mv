[workspace]
resolver = "2"
members = [
    "crates/aien-abi-core",
    "crates/aien-capability",
    "crates/aien-cli",
    "crates/aien-mcp",
    "crates/spark-cockpit-rs",
    "crates/cortex-rs",
    "crates/spark-hive",
    "crates/spark-supervisor",
    "crates/spark-discord-hub",
    "crates/spark-debugger",
    "crates/spark-harness",
    "crates/spark-dream",
    "crates/spark-adapters",
    "crates/spark-crumbs",
    "crates/spark-inquisitor",
    "crates/spark-max-cabi",
    "crates/spark-max-rs",
    "crates/cortex-encoder-rs",
    "crates/spark-mail-rs",
    "crates/spark-harvester",
    "crates/spark-aegis",
    "crates/aien-inference-abi",
    "crates/aien-kv-cache",
    "crates/aien-scheduler",
    "crates/aien-security",
    "crates/aien-platform",
    "crates/aien-platform-linux",
    "crates/aien-runtime",
    "crates/rad-id-sync",
    "crates/aien-inference-service",
    "crates/aien-inference-runtime",
    "crates/cortex-path-m1",
    "crates/aien-omega-gpu",
    "crates/aien-omega-compose",
    "crates/aien-campaign-verifier",
    "crates/aien-proof",
    "crates/crumbs",
    "crates/aien-closure",
    "crates/aien-switchboard",
    "crates/aien-dual-observation",
    "crates/aien-allen",
    "crates/aien-allen-memory",
    "tools/aien-test",
    "crates/aien-drive",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Drake Stapleton <aien@aienos.com>"]
repository = "https://github.com/aien-dev/aien-sovereign-core"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
